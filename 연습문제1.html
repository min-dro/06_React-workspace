<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>게시글 검색</title>
</head>
<body>

<h2>게시글 검색</h2>

<input type="text" id="keyword" placeholder="검색어 입력">
<button onclick="searchBoard();">검색</button>
<button onclick="printAll();">전체보기</button>

<hr>

<div id="boardList"></div>

<!--

게시글 제목 배열이 주어졌다고 가정한다.

var boards = [
    "자바스크립트 복습",
    "리액트 시작하기",
    "스프링 게시판 만들기",
    "회원가입 기능 구현",
    "자바스크립트 이벤트"
];

검색어를 입력하면 제목에 검색어가 포함된 게시글만 화면에 출력하시오.
검색어가 없으면 전체 목록을 출력하시오.

-->

<script>
var boards = [
    "자바스크립트 복습",
    "리액트 시작하기",
    "스프링 게시판 만들기",
    "회원가입 기능 구현",
    "자바스크립트 이벤트"
];

function printAll() {
    let boardList = document.getElementById("boardList");
    let resultStr = "";
    for(let i = 0; i < boards.length; i++) {
        resultStr += boards[i] + "<br>";
    }
    boardList.innerHTML = resultStr;
}

function searchBoard() {

    let keyword = document.getElementById("keyword").value;
    let boardList = document.getElementById("boardList");
    if(keyword == "") {
        printAll();
    } else {
        let resultStr = "";

        for(let i = 0; i < boards.length; i++) {
            if(boards[i].includes(keyword)) {
                resultStr += boards[i] + "<br>";
            }
        }
        boardList.innerHTML = resultStr;
    }
}

printAll();
</script>

</body>
</html>
