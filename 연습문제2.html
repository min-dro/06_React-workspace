<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>메뉴 주문 시스템</title>
</head>
<body>

<h2>메뉴 주문</h2>

<!--

메뉴명, 가격이 들어있는 배열을 만든다.

var menus = [
    { name: "아메리카노", price: 3000 },
    { name: "카페라떼", price: 4000 },
    { name: "바닐라라떼", price: 4500 }
];

메뉴와 그 메뉴에 따른 주문버튼을 화면에 출력하고, 주문 버튼 클릭 시 주문 목록에 추가하시오.

출력 내용:

주문한 메뉴 목록
총 주문 금액
주문 개수

-->

<div id="menuList"></div>

<hr>

<h3>주문 목록</h3>
<div id="orderList"></div>

<p>주문 개수 : <span id="orderCount">0</span>개</p>
<p>총 주문 금액 : <span id="totalPrice">0</span>원</p>

<script>
var menus = [
    { name: "아메리카노", price: 3000 },
    { name: "카페라떼", price: 4000 },
    { name: "바닐라라떼", price: 4500 }
];

var orders = [];

function printMenu() {
    let menuList = document.getElementById("menuList");
    let resultStr = "";
    for(let i = 0; i < menus.length; i++) {
        resultStr += menus[i].name + " <button onclick='orderMenu(" + i + ")'>주문</button><br>";
    }
    menuList.innerHTML = resultStr;
    
}

function orderMenu(index) {
    let orderList = document.getElementById("orderList");
    let totalPrice = document.getElementById("totalPrice");
    let resultStr = ""
    let resultPrice = 0;
    orders.push(menus[index]);
    for(let i = 0; i < orders.length; i++){
        resultStr += orders[i].name + "<br>";
        resultPrice += orders[i].price;
    }
    orderList.innerHTML = resultStr;
    totalPrice.innerHTML = resultPrice; 
    printOrder();
}

function printOrder() {
    let orderCount = document.getElementById("orderCount");
    orderCount.innerHTML = orders.length;
}

printMenu();
</script>

</body>
</html>
